<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Traffic — PySpark Analytics</title>
<meta name="description" content="Google Maps-inspired traffic analytics with Apache PySpark, as a 3D mindmap you fly through.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body data-st="hub">
<div id="app">
  <canvas id="scene"></canvas>
</div>

<div id="top">
  <div class="brand"><b>NEON TRAFFIC</b><span>BIG DATA ANALYTICS · FA 2</span></div>
  <button id="back" class="ghost">← MAP</button>
</div>

<div id="hint">DRAG TO ORBIT · CLICK A NODE TO FLY · ← → KEYS · ESC FOR MAP</div>

<aside id="panel" class="glass"></aside>
<aside id="card" class="glass"></aside>
<div id="tip" class="glass"></div>

<div id="legend"><span>JAM</span><i></i><span>FREE FLOW</span><small>15 to 50 km/h</small></div>

<div id="ctl" class="glass">
  <button id="play" aria-label="play or pause">&#10074;&#10074;</button>
  <input id="scrub" type="range" min="0" max="23" step="1" value="6">
  <span id="cHour">06:00</span>
</div>

<div id="speedo" class="glass">
  <div class="l">CITY CLOCK</div>
  <div class="h" id="sHour">00:00</div>
  <div class="l">SPEED</div>
  <div class="s"><span id="sSpeed">0</span><small>km/h</small></div>
  <div class="bw"><div id="sBar"></div></div>
</div>

<nav id="nav"></nav>
<div id="fade"></div>
<div id="credit">Car model: Ferrari 458 Italia by vicent091036 (Sketchfab, CC-BY) · Data is synthetic</div>

<div id="loader">
  <div class="lt">NEON TRAFFIC</div>
  <div class="ls">warming up the engine…</div>
  <div class="lb"><div id="loadBar"></div></div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
